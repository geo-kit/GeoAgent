[project]
name = "GeoAgent"
version = "0.1.0"
description = "Minimal LangGraph assistant that operates the GeoView reservoir viewer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.67",
    "langchain-ollama>=0.3.3",
    "langchain-openai>=0.3.27",
    "langgraph>=0.5.0",
    "langgraph-cli[inmem]>=0.3.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/GeoAgent"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
